# PR 和推送 main 时检查前后端；推送 main 时检查全部通过后再构建并发布镜像。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一个 PR 的新提交取消还在跑的旧检查；main 上的每次推送都跑完，镜像按推送的顺序发布
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: backend
      # 数据库测试由 testcontainers 起 postgres:18 容器，GitHub 的 Ubuntu runner 自带 Docker
      - run: go test ./...
      # db/schema.txt 由迁移生成，改了迁移要一起提交
      - run: make schema && git diff --exit-code db/schema.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # pnpm 版本取自 package.json 的 packageManager
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # 包括测试文件（tsconfig.vitest.json）
      - run: pnpm exec tsc -b
      - run: pnpm test:unit --run

  image:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      # Dockerfile 的前两个阶段在构建机的平台上运行、Go 交叉编译，两个平台都不需要 QEMU
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
