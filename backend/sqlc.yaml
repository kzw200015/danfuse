version: "2"
sql:
  - engine: postgresql
    # 直接读取 goose 迁移文件作为 schema，sqlc 会忽略 -- +goose Down 部分
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: repository
        out: internal/repository
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: camel
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          # 警告是字符串数组，pgx 按 JSON 编解码
          - column: sync_runs.warnings
            go_type:
              type: string
              slice: true
