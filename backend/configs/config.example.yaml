# 配置模板：复制为 configs/config.yaml 后按需修改（config.yaml 已被 git 忽略）。
# 服务只在传入 -config 时读取配置文件（make run 会传入 configs/config.yaml），不传时只用默认值和环境变量。
#
# 所有配置项都可以用环境变量覆盖：前缀 DANFUSE_，层级用下划线连接。
# 例如 DANFUSE_DATABASE_DSN 覆盖 database.dsn，DANFUSE_SERVER_ADDR 覆盖 server.addr。

server:
  addr: ":8080"
  graceful_timeout: 10s
  read_timeout: 30s
  write_timeout: 30s

log:
  level: debug # debug | info | warn | error
  format: text # text | json

database:
  dsn: "postgres://postgres:postgres@localhost:5432/danfuse?sslmode=disable"
  max_conns: 10 # 0 表示用 pgx 的默认值
  min_conns: 1
  max_conn_lifetime: 1h
  max_conn_idle_time: 30m

# 弹弹 API：jellyfin-danmaku 插件里填的地址是 http(s)://<host>[:<port>]/dandanplay[/<token>]，插件会在后面拼 /api/v2。
dandanplay:
  token: "" # 可选；设置后弹弹 API 挂在 /dandanplay/<token>/api/v2，只能含字母、数字和 - . _ ~

# 目录源：同一时间只有一个，用 kind 选择种类，只读取选中那一种的设置块。
# 启动时不连接目录源，媒体库是否存在、类型对不对在每次同步时检查。
catalog_source:
  kind: "" # 为空表示不启用同步；目前只支持 jellyfin
  jellyfin:
    url: "" # 例如 http://192.168.1.10:8096，可带子路径；末尾的 / 会被去掉
    api_key: "" # 只作为请求头发送，不写日志
    libraries: [] # 要同步的媒体库名，必填；环境变量里用逗号分隔，例如 DANFUSE_CATALOG_SOURCE_JELLYFIN_LIBRARIES=番剧,电影

sync:
  interval: 0 # 定时同步的间隔，例如 24h；0 表示关闭。启动时不立即同步

# B 站：贴 B 站链接创建绑定、拉取弹幕。
bilibili:
  # 可选。浏览器 Cookie 里 SESSDATA 的值，原样复制（逗号显示为 %2C）。只作为 Cookie 发给 B 站，不写日志、不入库。
  # 未配置时以未登录的身份拉取，弹幕可能不全；过期后同样退化成未登录的效果。它就是账号的登录凭据，建议用小号。
  sessdata: ""
