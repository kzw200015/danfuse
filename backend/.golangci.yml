version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errorlint
    - gocritic
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint # 也报出不再需要的 nolint 指令（allow-unused 默认为 false）
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace
  settings:
    # 业务按领域分包（internal/catalog、binding、seasonbinding、dandan），领域内的依赖方向：handler*.go → service → xxxdb（sqlc 生成）。
    # 适配器（领域的子包）和纯计算包不访问数据库；只有 app 装配适配器。
    # depguard 只能按文件和包前缀匹配：新增领域时把它的 xxxdb 加进 handler 规则的 deny。
    depguard:
      rules:
        handler:
          files:
            - "**/internal/*/handler*.go"
          deny:
            - pkg: github.com/jackc/pgx
              desc: handler 经 service 访问数据库
            - pkg: github.com/kzw200015/danfuse/backend/internal/database
              desc: handler 经 service 访问数据库
            - pkg: github.com/kzw200015/danfuse/backend/internal/catalog/catalogdb
              desc: handler 经 service 访问数据库
            - pkg: github.com/kzw200015/danfuse/backend/internal/binding/bindingdb
              desc: handler 经 service 访问数据库
            - pkg: github.com/kzw200015/danfuse/backend/internal/seasonbinding/seasonbindingdb
              desc: handler 经 service 访问数据库
            - pkg: github.com/kzw200015/danfuse/backend/internal/dandan/dandandb
              desc: handler 经 service 访问数据库
        pure:
          files:
            - "**/internal/catalog/jellyfin/**"
            - "**/internal/catalog/naming/**"
            - "**/internal/source/**"
            - "**/internal/danmaku/**"
            - "**/internal/danmakufile/**"
            - "**/internal/fulltext/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: 适配器和纯计算包不访问数据库，读写数据库的业务放在领域包的 service
            - pkg: github.com/kzw200015/danfuse/backend/internal/database
              desc: 适配器和纯计算包不访问数据库，读写数据库的业务放在领域包的 service
            - pkg: github.com/kzw200015/danfuse/backend/internal/httpx
              desc: apierr 只用于管理 API 的出口；适配器和纯计算包自己定义错误类型（如 source.Error、catalog.Error），由 service 转换
        dandan:
          files:
            - "**/internal/dandan/**"
          deny:
            - pkg: github.com/kzw200015/danfuse/backend/internal/httpx/apierr
              desc: 弹弹 API 按官方 Swagger 的结构输出，自己返回弹弹play 结构的错误，不交给 errorHandler
        adapters:
          files:
            - "$all"
            - "!**/internal/app/**"
            - "!**/internal/catalog/jellyfin/**"
            - "!**/internal/source/bilibili/**"
          deny:
            - pkg: github.com/kzw200015/danfuse/backend/internal/catalog/jellyfin
              desc: 适配器只由 internal/app 装配，业务代码依赖 catalog.Source 接口
            - pkg: github.com/kzw200015/danfuse/backend/internal/source/bilibili
              desc: 适配器只由 internal/app 装配，业务代码依赖 source.Adapter 接口
    misspell:
      ignore-rules:
        - relateds # 弹弹play 协议的字段名
  exclusions:
    # sqlc 生成的代码带有 "Code generated ... DO NOT EDIT." 头，自动跳过
    generated: lax
    presets:
      - comments # 不强制为导出标识符、包写注释
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kzw200015/danfuse
