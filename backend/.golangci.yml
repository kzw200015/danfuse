version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint # 也报出不再需要的 nolint 指令（allow-unused 默认为 false）
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace
  settings:
    misspell:
      ignore-rules:
        - relateds # 弹弹play 协议的字段名
  exclusions:
    # sqlc / wire 生成的代码带有 "Code generated ... DO NOT EDIT." 头，自动跳过
    generated: lax
    presets:
      - comments # 不强制为导出标识符、包写注释
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kzw200015/danfuse
