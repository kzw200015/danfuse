# 端到端环境：Jellyfin 10.11 与 12.1 只读挂载同一个测试媒体库，加上 PostgreSQL 18 和用本地源码构建的 danfuse。
# 用法见 README.md；端口只绑定在本机。
name: danfuse-e2e

services:
  jellyfin-10-11:
    image: jellyfin/jellyfin:10.11.11
    ports:
      - "127.0.0.1:28096:8096"
    volumes:
      - jellyfin-10-11-config:/config
      - jellyfin-10-11-cache:/cache
      - ./media:/media:ro
    restart: unless-stopped

  jellyfin-12-1:
    image: jellyfin/jellyfin:12.1.20260915-010956
    ports:
      - "127.0.0.1:28097:8096"
    volumes:
      - jellyfin-12-1-config:/config
      - jellyfin-12-1-cache:/cache
      - ./media:/media:ro
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: danfuse
      POSTGRES_PASSWORD: danfuse
      POSTGRES_DB: danfuse
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danfuse -d danfuse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  danfuse:
    build: ..
    ports:
      - "127.0.0.1:28080:8080"
    environment:
      DANFUSE_DATABASE_DSN: postgres://danfuse:danfuse@postgres:5432/danfuse?sslmode=disable
      DANFUSE_CATALOG_SOURCE_KIND: jellyfin
      # 容器里用服务名访问 Jellyfin，默认同步 12.1。改为同步 10.11：在 .env 里加上
      # JELLYFIN_URL=http://jellyfin-10-11:8096 和 JELLYFIN_API_KEY=<JELLYFIN_10_11_API_KEY 的值>，
      # 再 docker compose up -d danfuse
      DANFUSE_CATALOG_SOURCE_JELLYFIN_URL: ${JELLYFIN_URL:-http://jellyfin-12-1:8096}
      DANFUSE_CATALOG_SOURCE_JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-${JELLYFIN_12_1_API_KEY:-}}
      DANFUSE_CATALOG_SOURCE_JELLYFIN_LIBRARIES: 番剧,电影,其他
      DANFUSE_BILIBILI_SESSDATA: ${BILIBILI_SESSDATA:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  jellyfin-10-11-config:
  jellyfin-10-11-cache:
  jellyfin-12-1-config:
  jellyfin-12-1-cache:
  postgres-data:
