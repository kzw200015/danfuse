# 端到端环境：Jellyfin 10.11 与 12.1 只读挂载同一个测试媒体库，加上 PostgreSQL 18。
# 用法见 README.md；端口只绑定在本机。
name: danfuse-e2e

services:
  jellyfin-10-11:
    image: jellyfin/jellyfin:10.11.11
    ports:
      - "127.0.0.1:28096:8096"
    volumes:
      - jellyfin-10-11-config:/config
      - jellyfin-10-11-cache:/cache
      - ./media:/media:ro
    restart: unless-stopped

  jellyfin-12-1:
    image: jellyfin/jellyfin:12.1.20260915-010956
    ports:
      - "127.0.0.1:28097:8096"
    volumes:
      - jellyfin-12-1-config:/config
      - jellyfin-12-1-cache:/cache
      - ./media:/media:ro
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: danfuse
      POSTGRES_PASSWORD: danfuse
      POSTGRES_DB: danfuse
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danfuse -d danfuse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  jellyfin-10-11-config:
  jellyfin-10-11-cache:
  jellyfin-12-1-config:
  jellyfin-12-1-cache:
  postgres-data:
